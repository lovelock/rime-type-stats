[package]
name = "rime-counter"
version = "0.1.0"
edition = "2021"

[lib]
name = "rime_counter"
path = "src/lib.rs"

[[bin]]
name = "rime-counter"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
tao = "0.30"