[package]
name = "rime-type-stats"
version = "0.1.0"
edition = "2021"

[lib]
name = "rime_type_stats"
path = "src/lib.rs"

[[bin]]
name = "rime-type-stats"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.19", default-features = false }
tao = "0.30"